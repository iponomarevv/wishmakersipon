# Cloud Build configuration для автоматического деплоя
steps:
  # Собрать Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wishmakers:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wishmakers:latest'
      - '.'

  # Запушить image в Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/wishmakers:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/wishmakers:latest'

  # Деплой на Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wishmakers'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wishmakers:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/wishmakers:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/wishmakers:latest'

options:
  logging: CLOUD_LOGGING_ONLY

